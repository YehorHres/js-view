<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
    <h1>Створити акаунт</h1>
    <p class="subtitle">Приєднуйся до нас, гордість району!!!</p>
    <form id="register-form" novalidate>
        <div class="field">
            <label for="username">Ім'я користувача</label>
            <input type="text" id="username" autocomplete="username" placeholder="Наприклад, Іван" required>
            <small id="username-error" class="error"></small>
        </div>
        <div class="field">
            <label for="email">Електронна пошта</label>
            <input type="email" id="email" autocomplete="email" placeholder="abc@example.com" required>
            <small id="email-error" class="error"></small>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <div class="password-row">
                <input type="password" id="password" autocomplete="new-password" placeholder="Мінімум 8 символів" required>
                <button id="toggle-password" class="toggle" type="button">🧿</button>
            </div>
            <small id="password-error" class="error"></small>
            <div class="strength-track"><div id="strength-bar"></div></div>
            <small id="strength-text">Надійність пароля</small>
        </div>
        <div class="field">
            <label for="confirm-password">Повторіть пароль</label>
            <div class="password-row">
                <input type="password" id="confirm-password" autocomplete="new-password" placeholder="Повторіть пароль" required>
            </div>
            <small id="confirm-error" class="error"></small>
        </div>
        <div class="field">
            <label class="terms"><input id="terms" type="checkbox" required> Погоджуюсь з умовами</label>
            <small id="terms-error" class="error"></small>
        </div>
        <button class="submit" type="submit">Зареєструватись</button>
        <p id="result"></p>
    </form>
</main>

<script src="script.js"></script>
</body>
</html>
